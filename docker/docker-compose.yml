version: '3.8'

services:
  mysql:
    image: mysql:8.0
    container_name: shop-mysql
    ports:
      - '3306:3306'
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: shop
      MYSQL_USER: shop
      MYSQL_PASSWORD: shop123
    volumes:
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
      - mysql_data:/var/lib/mysql
    networks:
      - shop-network

  redis:
    image: redis:7.0
    container_name: shop-redis
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    networks:
      - shop-network

  django:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shop-django
    ports:
      - '8000:8000'
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../backend:/app
    depends_on:
      - mysql
      - redis
    networks:
      - shop-network

  celery:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shop-celery
    command: celery -A apps.tasks.celery worker -l info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../backend:/app
    depends_on:
      - mysql
      - redis
      - django
    networks:
      - shop-network

  celery-beat:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: shop-celery-beat
    command: celery -A apps.tasks.celery beat -l info
    environment:
      - DJANGO_SETTINGS_MODULE=config.settings
      - DATABASE_HOST=mysql
      - DATABASE_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ../backend:/app
    depends_on:
      - mysql
      - redis
      - django
    networks:
      - shop-network

  nginx:
    image: nginx:1.25
    container_name: shop-nginx
    ports:
      - '80:80'
      - '443:443'
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf
      - ../frontend/admin/dist:/usr/share/nginx/html/admin
      - ../frontend/mobile/dist:/usr/share/nginx/html/mobile
      - ./ssl:/etc/nginx/ssl
    depends_on:
      - django
    networks:
      - shop-network

volumes:
  mysql_data:
  redis_data:

networks:
  shop-network:
    driver: bridge